<title>Acesso restrito</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3f5;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1b2733}
.card{background:#fff;width:100%;max-width:360px;margin:16px;padding:28px 24px;border-radius:10px;box-shadow:0 8px 30px rgba(16,32,48,.15);border:1px solid #d6e0e5}

label{display:block;font-size:12px;font-weight:700;margin:12px 0 4px;color:#0b5a70}
input[type=text],input[type=password]{width:100%;padding:11px;font-size:16px;border:1px solid #b9c8d0;border-radius:6px}
button{width:100%;margin-top:18px;padding:12px;font-size:15px;font-weight:700;color:#fff;background:#0f7490;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#msg{color:#b3261e;font-size:13px;min-height:18px;margin-top:10px;font-weight:600}
.aviso{font-size:11.5px;color:#5b6b78;margin-top:14px;line-height:1.4}
</style></head><body>
<form class="card" id="f" autocomplete="on">

<label for="p">Senha</label><input type="password" id="p" name="password" autocomplete="current-password" required>
<button id="b" type="submit">Entrar</button><div id="msg"></div>
<div class="aviso">Uso individual. Cada acesso é identificado na tela com login, data, hora e IP. Não compartilhe sua senha.</div>
</form>

async function horaServidor(){
  const base=location.href.split('#')[0].split('?')[0];
  const dir=base.replace(/[^\/]*$/,'');
  const rnd=()=>Date.now()+'-'+Math.random().toString(36).slice(2);
  /* 1ª tentativa: endereço inexistente (nunca está em cache, então o cabeçalho Date é atual);
     2ª: a própria página com parâmetro aleatório */
  const urls=[dir+'__hora_'+rnd(), base+'?t='+rnd()];
  for(const u of urls){
    try{
      const c=new AbortController(); const t=setTimeout(()=>c.abort(),6000);
      const r=await fetch(u,{method:'HEAD',cache:'no-store',signal:c.signal});
      clearTimeout(t);
      const d=r.headers.get('date'); const age=parseInt(r.headers.get('age')||'0',10)||0;
      if(d){ const ms=Date.parse(d); if(!isNaN(ms)) return ms+age*1000; }
    }catch(_){}
  }
  /* Plano B: serviços públicos de hora (só se o próprio site não informar) */
  const comTempo=async(u,f)=>{ try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),6000); const r=await fetch(u,{cache:'no-store',signal:c.signal}); clearTimeout(t); return f(await r.json()); }catch(_){ return null; } };
  let ms=await comTempo('https://worldtimeapi.org/api/timezone/America/Sao_Paulo',j=>(j&&j.unixtime)?j.unixtime*1000:null);

  if(ms) return ms;
  return null;
}
